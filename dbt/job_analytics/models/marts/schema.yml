version: 2

models:
  - name: mart_skill_demand
    description: Share of active jobs requiring each canonical skill, per seniority and overall ('all').
    data_tests:
      - unique_combination:
          arguments:
            columns: [seniority_level, skill]
    columns:
      - name: pct_of_jobs
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_salary_by_seniority
    description: Salary quartiles per seniority, currency and period (groups with >= min_salary_sample jobs).
    data_tests:
      - unique_combination:
          arguments:
            columns: [seniority_level, salary_currency, salary_period]

  - name: mart_source_quality
    description: Field completeness per source.
    columns:
      - name: source
        data_tests: [unique, not_null]
      - name: pct_no_skills
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_daily_ingestion
    description: Raw payload versions, new and changed jobs per crawl date and source.
    data_tests:
      - unique_combination:
          arguments:
            columns: [crawl_date, source]

  - name: mart_unmapped_skills
    description: Source skill labels not covered by the skill taxonomy.
    columns:
      - name: skill
        data_tests: [unique, not_null]
