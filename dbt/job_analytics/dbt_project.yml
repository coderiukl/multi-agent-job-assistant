name: job_analytics
version: "1.0.0"
profile: job_analytics
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Python (app/) owns operational normalization: per-source mappers, Pydantic
# validation, deduplication, the skill taxonomy. dbt owns the analytics layer
# on top of it: staging views over public.jobs / raw.job_records and marts
# (skill demand, salary bands, source quality, ingestion) with data tests.
models:
  job_analytics:
    staging:
      +materialized: view
      +schema: staging        # -> analytics_staging
    marts:
      +materialized: table
      +schema: marts          # -> analytics_marts

vars:
  # Salary statistics are only published for groups with at least this many jobs.
  min_salary_sample: 5
