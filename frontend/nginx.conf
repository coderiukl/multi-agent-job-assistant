server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Cho phép multipart chứa file PDF tối đa 10 MB
    # cùng phần dữ liệu bao quanh.
    client_max_body_size 12m;

    # Docker DNS: tìm lại backend khi container đổi IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $backend_url http://backend:8000;

    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Một request có thể chạy qua nhiều agent hoặc OCR.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_cache off;

        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
    }
}